<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshNest Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f1f3f5;
    }
    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
      padding-top: 20px;
      position: fixed;
      width: 200px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 10px 20px;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .content {
      margin-left: 200px;
      padding: 20px;
    }
    .card {
      margin-bottom: 20px;
    }
  </style>
</head>
<body onload="checkAccess()">
  <div class="sidebar">
    <h4 class="text-center">Admin Panel</h4>
    <a href="#dashboard">Dashboard</a>
    <a href="#orders">Orders</a>
    <a href="#inventory">Inventory</a>
    <a href="#messages">Messages</a>
    <a href="#records">Records</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
  <div class="content">
    <h2 id="dashboard">Dashboard Overview</h2>
    <div class="row">
      <div class="col-md-4">
        <div class="card text-bg-primary">
          <div class="card-body">
            <h5 class="card-title">Total Orders</h5>
            <p class="card-text" id="orderCount">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-bg-success">
          <div class="card-body">
            <h5 class="card-title">Egg Stock</h5>
            <p class="card-text" id="stockCount">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-bg-warning">
          <div class="card-body">
            <h5 class="card-title">Messages</h5>
            <p class="card-text" id="messageCount">0</p>
          </div>
        </div>
      </div>
    </div>

    <h3 id="orders">Recent Orders</h3>
    <form onsubmit="addOrder(event)">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" class="form-control" id="orderId" placeholder="Order ID" required />
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" id="orderCustomer" placeholder="Customer Name" required />
        </div>
        <div class="col-md-2">
          <input type="number" class="form-control" id="orderQty" placeholder="Qty" required />
        </div>
        <div class="col-md-2">
          <select class="form-select" id="orderStatus" required>
            <option value="Delivered">Delivered</option>
            <option value="Pending">Pending</option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-success w-100">Add Order</button>
        </div>
      </div>
    </form>

    <table class="table table-striped mt-3" id="orderTable">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Quantity</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3 id="inventory">Manage Inventory</h3>
    <form onsubmit="updateStock(event)">
      <div class="mb-3">
        <label for="newStock" class="form-label">Update Egg Stock</label>
        <input type="number" class="form-control" id="newStock" required />
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
    </form>

    <h3 id="messages">Customer Messages</h3>
    <ul class="list-group" id="messageList"></ul>

    <h3 id="records">All Records</h3>
    <pre id="recordsOutput" style="background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 6px;"></pre>
  </div>

  <script>
    function checkAccess() {
      const adminStatus = localStorage.getItem('isAdmin');
      if (adminStatus !== 'true') {
        alert('Access denied. Please login first.');
        window.location.href = 'login.html';
        return;
      }
      loadDashboard();
    }

    function logout() {
      localStorage.removeItem('isAdmin');
      window.location.href = 'login.html';
    }

    function updateStock(event) {
      event.preventDefault();
      const newStock = document.getElementById("newStock").value;
      localStorage.setItem('stockCount', newStock);
      document.getElementById("stockCount").innerText = newStock;
      alert("Stock updated to " + newStock);
      updateRecords();
    }

    function addOrder(event) {
      event.preventDefault();
      const id = document.getElementById('orderId').value;
      const customer = document.getElementById('orderCustomer').value;
      const qty = document.getElementById('orderQty').value;
      const status = document.getElementById('orderStatus').value;

      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      orders.push({ id, customer, qty, status });
      localStorage.setItem('orders', JSON.stringify(orders));

      document.getElementById('orderId').value = '';
      document.getElementById('orderCustomer').value = '';
      document.getElementById('orderQty').value = '';
      document.getElementById('orderStatus').value = 'Delivered';

      loadDashboard();
    }

    function loadDashboard() {
      document.getElementById("stockCount").innerText = localStorage.getItem('stockCount') || '0';

      const messages = JSON.parse(localStorage.getItem('messages') || '[]');
      const messageList = document.getElementById('messageList');
      messageList.innerHTML = '';
      messages.forEach(msg => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = msg;
        messageList.appendChild(li);
      });
      document.getElementById("messageCount").innerText = messages.length;

      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const tbody = document.querySelector('#orderTable tbody');
      tbody.innerHTML = '';
      orders.forEach((order, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${order.id}</td>
          <td>${order.customer}</td>
          <td>${order.qty}</td>
          <td>${order.status}</td>
          <td><button class="btn btn-sm btn-warning" onclick="editOrder(${index})">Edit</button></td>
        `;
        tbody.appendChild(row);
      });
      document.getElementById("orderCount").innerText = orders.length;

      updateRecords();
    }

    function editOrder(index) {
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const order = orders[index];
      if (!order) return;

      document.getElementById('orderId').value = order.id;
      document.getElementById('orderCustomer').value = order.customer;
      document.getElementById('orderQty').value = order.qty;
      document.getElementById('orderStatus').value = order.status;

      orders.splice(index, 1);
      localStorage.setItem('orders', JSON.stringify(orders));
      loadDashboard();
    }

    function updateRecords() {
      const stock = localStorage.getItem('stockCount') || '0';
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const messages = JSON.parse(localStorage.getItem('messages') || '[]');
      const records = {
        Stock: stock,
        Orders: orders,
        Messages: messages
      };
      document.getElementById("recordsOutput").innerText = JSON.stringify(records, null, 2);
    }
  </script>
</body>
</html>
