<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - FreshNest Egg Poultry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    .header {
      background-color: #f8f9fa;
      padding: 40px 0;
      text-align: center;
    }
    .section-padding {
      padding: 60px 0;
    }
    .contact-box {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1 class="display-5 fw-bold">Contact Us</h1>
    <p class="lead">We’re here to help you</p>
  </div>

  <!-- Contact Form Section -->
  <section class="section-padding">
    <div class="container">
      <div class="row g-4">

        <div class="col-md-6">
          <div class="contact-box">
            <h4>Send Us a Message</h4>
            <form onsubmit="submitContact(event)">
              <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>
        </div>

        <div class="col-md-6">
          <div class="contact-box">
            <h4>Farm Address</h4>
            <p>Pokhara, Nepal</p>
            <p>Email: <a href="mailto:digitalbrp@gmail.com">digitalbrp@gmail.com</a></p>
            <p>Phone: <a href="https://api.whatsapp.com/send?phone=9779868156268" target="_blank">+977 9868156268 (WhatsApp)</a></p>
            <h5 class="mt-4">Google Map</h5>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3531.885494743672!2d83.98556691506147!3d28.209555712049446!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995957a7a122f13%3A0x34f1396b50a2fa5d!2sPokhara!5e0!3m2!1sen!2snp!4v1620834064236!5m2!1sen!2snp"
              width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script>
    function submitContact(e) {
      e.preventDefault();
      alert('Thank you for contacting FreshNest! We will reply soon.');
    }
  </script>
</body>
</html>
